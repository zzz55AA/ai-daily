name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -a index.html archive.js .nojekyll archive _site/
          find . -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex './[0-9]{4}' -exec cp -a {} _site/ \;
          find . -mindepth 1 -maxdepth 1 -type f -name '*.html' ! -name index.html -exec cp -a {} _site/ \;
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
